version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "borisdamevin"
    reviewers:
      - "borisdamevin"
    groups:
      vitepress:
        patterns:
          - "vitepress"
          - "vue"
          - "@frontfactory/*"
      tooling:
        patterns:
          - "@commitlint/*"
          - "husky"
          - "@resvg/*"
          - "@fontsource*"
          - "@expo-google-fonts/*"
